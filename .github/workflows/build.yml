name: build

on:
  workflow_call:
    inputs:
      release_tag:
        description: "Release tag (e.g. v1.2.3 or b1.2.3). If set, uploads release assets."
        required: false
        type: string
        default: ""
      pre_release:
        description: "Publish the GitHub release as a pre-release."
        required: false
        type: boolean
        default: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,      name: macos-arm64    }
          - { os: ubuntu-latest,     name: linux-x86_64   }
          - { os: ubuntu-24.04-arm,  name: linux-arm64    }
          - { os: windows-latest,    name: windows-x86_64 }
          - { os: windows-11-arm,    name: windows-arm64  }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Set VERSION
        if: inputs.release_tag != ''
        shell: bash
        env:
          TAG_NAME: ${{ inputs.release_tag }}
        run: |
          version="${TAG_NAME#v}"
          version="${version#b}"
          echo "VERSION=${version}" >> "$GITHUB_ENV"

      - name: Verify release version
        if: inputs.release_tag != ''
        shell: bash
        env:
          TAG_NAME: ${{ inputs.release_tag }}
        run: |
          version="${TAG_NAME#v}"
          version="${version#b}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag must be v<major>.<minor>.<patch> or b<major>.<minor>.<patch>: ${TAG_NAME}"
            exit 1
          fi

          server_version="$(sed -n 's/^#define OPENMV_MCP_VERSION "\(.*\)"/\1/p' src/openmv_version.h)"

          if [ "$version" != "$server_version" ]; then
            echo "::error::Tag version ${version} does not match src/openmv_version.h version ${server_version}"
            exit 1
          fi

      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install clang-format llvm
          echo "$(brew --prefix llvm)/bin" >> $GITHUB_PATH

      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev libudev-dev cmake clang-tidy clang-format

      - name: Install tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $llvmBin = "C:\Program Files\LLVM\bin"
          $env:Path = "$llvmBin;$env:Path"
          echo $llvmBin >> $env:GITHUB_PATH

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Check format
        run: cmake --build build --target check

      - name: Build server
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            cmake --build build --config Release -j$(sysctl -n hw.ncpu)
          else
            cmake --build build --config Release -j
          fi

      - name: Test
        run: ctest --test-dir build --output-on-failure -C Release

      - name: Stage release assets (Unix)
        if: inputs.release_tag != '' && runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          cp build/openmv_mcp_server "dist/openmv_mcp_server-${VERSION}-${{ matrix.name }}"

      - name: Stage release assets (Windows)
        if: inputs.release_tag != '' && runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "build/Release/openmv_mcp_server.exe" "dist/openmv_mcp_server-$env:VERSION-${{ matrix.name }}.exe"

      - name: Upload to release
        if: inputs.release_tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag }}
          prerelease: ${{ inputs.pre_release }}
          files: |
            dist/openmv_mcp_server-${{ env.VERSION }}-${{ matrix.name }}*
